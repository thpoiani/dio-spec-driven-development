name: Publicar slides

# Publica o conteúdo de slides/ no GitHub Pages.
# Pré-requisito: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar slides/
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
